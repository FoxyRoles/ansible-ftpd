---

- name: Install the Python cryptography library for TLS management
  ansible.builtin.apt:
    name: python3-cryptography
    state: present
  register: pure_tls_cryptography

- ansible.builtin.import_tasks: tls-dhparams.yml

- name: Select the Pure-FTPd certificate source
  vars:
    pure_tls_certbot_directory: "/etc/letsencrypt/live/{{ ansible_facts['fqdn'] }}"
    pure_tls_has_certbot: >-
      {{ pure_tls_certbot_files.results | selectattr('stat.isreg', 'defined')
        | selectattr('stat.isreg') | list | length == 2 }}
  block:
    - name: Check for both Certbot certificate files
      ansible.builtin.stat:
        path: "{{ pure_tls_certbot_directory }}/{{ item }}"
        follow: true
        get_checksum: false
      loop:
        - privkey.pem
        - fullchain.pem
      register: pure_tls_certbot_files

    - name: Use the Certbot certificate
      ansible.builtin.include_tasks: tls-certbot.yml
      when: pure_tls_has_certbot

    - name: Maintain the fallback certificate
      ansible.builtin.include_tasks: tls-selfsigned.yml
      when:
        - not pure_tls_has_certbot
        - not ansible_check_mode or pure_tls_cryptography is not changed

- name: Allow TLS
  ansible.builtin.copy:
    src: TLS
    dest: /etc/pure-ftpd/conf/TLS
    mode: '0644'
  notify: restart ftpd
