---

- name: Read the selected private key and certificate chain
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ pure_tls_key_path }}"
    - "{{ pure_tls_chain_path }}"
  register: pure_tls_parts
  no_log: true

- name: Install the combined PEM file
  ansible.builtin.copy:
    content: "{{ (pure_tls_parts.results[0].content | b64decode) ~ (pure_tls_parts.results[1].content | b64decode) }}"
    dest: "{{ pure_certificate_path }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  notify: restart ftpd
