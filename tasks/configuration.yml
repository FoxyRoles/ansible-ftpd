---

- name: Allow dot files
  ansible.builtin.copy:
    src: YesFile
    dest: /etc/pure-ftpd/conf/AllowDotFiles
    mode: '0644'
  notify:
    - restart ftpd

- name: Allow chroot everyone
  ansible.builtin.copy:
    src: YesFile
    dest: /etc/pure-ftpd/conf/ChrootEveryone
    mode: '0644'
  notify:
    - restart ftpd

- name: Set passive port range
  ansible.builtin.template:
    src: PassivePortRange.j2
    dest: /etc/pure-ftpd/conf/PassivePortRange
    mode: '0644'
  notify:
    - restart ftpd

- name: Disable unneeded authentications
  ansible.builtin.file:
    dest: /etc/pure-ftpd/auth/{{ item }}
    state: absent
  loop:
    - 65unix
    - 70pam
  notify:
    - restart ftpd

- name: Disallow unneeded authentications
  ansible.builtin.file:
    dest: /etc/pure-ftpd/conf/{{ item }}
    state: absent
  loop:
    - PAMAuthentication
    - UnixAuthentication
  notify:
    - restart ftpd
